<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#F6E8EE"/>
<title>Petit Marché</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F7EDE8; --paper:#FFFBFA; --ink:#3B2A32; --mute:#8A6F79;
  --rose:#C45C7A; --blush:#F3C5D3; --gold:#C9A36A; --line:#EAD6DC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#FBEFF3 0%,#F7EDE8 40%,#F4E4DC 100%);color:var(--ink);
  font:16px/1.45 Nunito,system-ui,sans-serif;padding-bottom:96px;min-height:100dvh}
header{padding:22px 20px 8px;position:sticky;top:0;background:linear-gradient(180deg,#FBEFF3 70%,transparent);z-index:5}
h1{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:600;margin:0;letter-spacing:.3px}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
main{padding:6px 18px 28px}
input,select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:16px;color:var(--ink);padding:13px 14px;font:16px Nunito;margin:6px 0}
.btn{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:14px 16px;width:100%;font-weight:700;font-size:15px;margin:8px 0}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:12px;width:100%;margin:6px 0;font-weight:700}
.gold{background:#E9D5A3;color:#3B2A32}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(196,92,122,.08)}
.hero{width:100%;height:160px;object-fit:cover;border-radius:16px;background:#EED7DE;margin-bottom:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pill{background:#F8E4EB;color:#7A3D52;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}
.aisle{color:var(--rose);font-weight:800;letter-spacing:.8px;font-size:12px;text-transform:uppercase;margin:16px 0 6px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check{width:22px;height:22px;border:2px solid var(--rose);border-radius:8px;flex-shrink:0;margin-top:2px}
.check.on{background:var(--rose)}
.done{text-decoration:line-through;color:var(--mute)}
.price{color:var(--rose);font-weight:800}
.muted{color:var(--mute);font-size:13px}
nav{position:fixed;left:10px;right:10px;bottom:10px;background:rgba(255,251,250,.92);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:24px;display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 12px 30px rgba(59,42,50,.08)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:11px/1.2 Nunito;font-weight:700}
nav button.on{color:var(--rose)}
</style>
</head>
<body>
<header>
  <h1 id="title">Petit Marché</h1>
  <div class="sub" id="subtitle">Recipes, a pretty list, King Soopers estimates</div>
</header>
<main id="app"></main>
<nav>
  <button class="on" data-tab="recipes">Recipes</button>
  <button data-tab="list">List</button>
  <button data-tab="scan">Lookup</button>
  <button data-tab="trends">Body</button>
  <button data-tab="settings">Me</button>
</nav>
<script src="app.js?v=4"></script>
</body>
</html>
