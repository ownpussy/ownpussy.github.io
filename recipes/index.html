<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0D0D0D"/>
<title>Recipe Shop</title>
<style>
:root{--bg:#0D0D0D;--card:#161616;--border:#2A2A2A;--mint:#3EB489;--teal:#00CED1;--text:#fff;--muted:#B0B0B0;--danger:#FF6B6B;--warn:#F5C542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:88px}
header{padding:18px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{margin:0;font-size:26px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
main{padding:0 16px 24px}
input,select{width:100%;background:#1A1A1A;border:1px solid var(--border);border-radius:12px;color:#fff;padding:12px;font-size:16px;margin:6px 0}
.btn{background:var(--mint);color:#04140C;border:0;border-radius:12px;padding:13px;width:100%;font-weight:700;font-size:16px;margin:8px 0}
.ghost{background:transparent;border:1px solid var(--border);color:#fff;border-radius:12px;padding:12px;width:100%;margin:6px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.aisle{color:var(--mint);font-weight:700;margin-top:14px}
.fit{border:1px solid var(--mint);border-radius:14px;padding:12px;margin:10px 0}
.fit.hurts{border-color:var(--danger)}.fit.mixed{border-color:var(--warn)}
.badge{font-weight:800;letter-spacing:.6px;font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:#1A1A1A;border-top:1px solid var(--border);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:11px}
nav button.on{color:var(--mint)}
.muted{color:var(--muted);font-size:13px}
.item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #222}
.check{width:22px;height:22px;border:2px solid var(--mint);border-radius:6px}
.check.on{background:var(--mint)}
.done{text-decoration:line-through;color:var(--muted)}
canvas{width:100%;background:#1A1A1A;border-radius:12px}
</style>
</head>
<body>
<header><h1 id="title">Recipes</h1><div class="sub" id="subtitle">Paste a recipe URL</div></header>
<main id="app"></main>
<nav>
<button class="on" data-tab="recipes">Recipes</button>
<button data-tab="list">List</button>
<button data-tab="scan">Scan</button>
<button data-tab="trends">Trends</button>
<button data-tab="settings">Settings</button>
</nav>
<script src="app.js"></script>
</body></html>
