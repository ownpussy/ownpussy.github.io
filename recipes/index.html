<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="smartcart kitchen"/>
<meta name="theme-color" content="#0D0D0D"/>
<title>smartcart kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Syne:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0D0D0D;--paper:#161616;--ink:#F2F7F5;--mute:#8AA39A;--mint:#3EB489;--teal:#00CED1;--line:#2A2A2A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0D0D0D;color:var(--ink);font:16px/1.45 "DM Sans",system-ui,sans-serif;padding-bottom:96px;min-height:100dvh}
header{padding:22px 20px 8px;position:sticky;top:0;background:linear-gradient(180deg,#0D0D0D 70%,transparent);z-index:5}
h1{font-family:Syne,sans-serif;font-size:28px;margin:0}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
main{padding:6px 18px 28px}
input,select{width:100%;background:#1A1A1A;border:1px solid var(--line);border-radius:14px;color:#fff;padding:13px 14px;font:16px "DM Sans";margin:6px 0}
.btn{background:var(--mint);color:#04140C;border:0;border-radius:999px;padding:14px 16px;width:100%;font-weight:700;font-size:15px;margin:8px 0}
.ghost{background:transparent;border:1.5px solid var(--line);color:#fff;border-radius:999px;padding:12px;width:100%;margin:6px 0;font-weight:700}
.gold{border-color:var(--teal);color:var(--teal)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.hero{width:100%;height:160px;object-fit:cover;border-radius:14px;background:#1F1F1F;margin-bottom:10px}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#222;flex-shrink:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pill{background:#10261C;color:var(--mint);border:1px solid #1E4A38;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}
.aisle{color:var(--teal);font-weight:800;letter-spacing:.8px;font-size:12px;text-transform:uppercase;margin:16px 0 6px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #222}
.check{width:22px;height:22px;border:2px solid var(--mint);border-radius:8px;flex-shrink:0;margin-top:2px}
.check.on{background:var(--mint)}
.done{text-decoration:line-through;color:var(--mute)}
.price{color:var(--mint);font-weight:800;text-align:right;white-space:nowrap}
.muted{color:var(--mute);font-size:13px}
#reader{width:100%;border-radius:16px;overflow:hidden;background:#111;min-height:220px;margin:8px 0}
#reader video,#reader canvas{width:100%!important;border-radius:16px}
nav{position:fixed;left:10px;right:10px;bottom:10px;background:#141414;border:1px solid var(--line);border-radius:24px;display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mute);font:11px/1.2 "DM Sans";font-weight:700}
nav button.on{color:var(--mint)}
</style>
</head>
<body>
<header>
  <h1 id="title">smartcart kitchen</h1>
  <div class="sub" id="subtitle">King Soopers prices · 136th & Quebec</div>
</header>
<main id="app"></main>
<nav>
  <button class="on" data-tab="recipes">Recipes</button>
  <button data-tab="list">List</button>
  <button data-tab="scan">Lookup</button>
  <button data-tab="trends">Body</button>
  <button data-tab="settings">Me</button>
</nav>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="app.js?v=9"></script>
</body>
</html>
