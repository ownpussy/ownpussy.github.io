<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PULSE"/>
<meta name="theme-color" content="#070708"/>
<title>PULSE</title>
<style>
:root{--buy:#3dffb0;--sell:#ff5a6a;--warm:#ffd56a;--ice:#7ec8ff;--line:rgba(214,220,230,.16);--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);--vh:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#000;color:#e8eaee;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.app{height:var(--vh);display:flex;flex-direction:column;background:repeating-linear-gradient(135deg,#121318 0 2px,#0c0d10 2px 4px),#090a0d}
.status{padding:calc(8px + var(--safe-top)) 14px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:650}.live{color:#7ee7ff}
.head{padding:6px 14px 8px;display:flex;justify-content:space-between;align-items:flex-end}.brand{font-size:28px;letter-spacing:.18em;font-weight:750;background:linear-gradient(180deg,#fff,#8e96a3);-webkit-background-clip:text;color:transparent}.sub{font-size:10px;letter-spacing:.16em;color:#8b909a}
.search{margin:0 12px 8px;display:flex;gap:8px}.search input{flex:1;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;padding:12px;font-size:16px}.search button{border:0;border-radius:12px;padding:0 14px;font-weight:800;background:linear-gradient(180deg,#f4f5f7,#9aa0ab);color:#111}
.chips{display:flex;gap:6px;overflow:auto;padding:0 12px 8px}.chips button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#c5c9d1;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap}.chips button.on{color:#111;background:linear-gradient(180deg,#fff,#b7bcc6)}
.screen{flex:1;overflow:auto;padding:0 12px calc(16px + var(--safe-bot))}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:16px;background:rgba(8,9,12,.72);padding:12px;text-align:left;color:inherit;width:100%}.sym{font-weight:750;font-size:15px}.px{font-variant-numeric:tabular-nums;font-weight:700;margin-top:4px}
.tag{display:inline-block;margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 6px;border-radius:6px}.HOT{background:rgba(255,90,106,.16);color:#ff8b96}.WARM{background:rgba(255,213,106,.14);color:var(--warm)}.COLD{background:rgba(126,200,255,.14);color:var(--ice)}.ICE{background:rgba(126,200,255,.08);color:#9ad}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:#101114;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + var(--safe-bot));box-shadow:0 -20px 40px rgba(0,0,0,.45)}
.row{display:flex;justify-content:space-between;gap:8px}.muted{color:#8b909a;font-size:12px;line-height:1.35}.buy{color:var(--buy)}.sell{color:var(--sell)}.close{border:0;background:transparent;color:#aaa;font-weight:700}svg{width:100%;height:180px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.k div{border:1px solid var(--line);border-radius:10px;padding:8px}.k b{display:block}
</style></head><body><div class="app">
<div class="status"><span id="clock">-</span><span class="live" id="src">LIVE</span><span id="size">FIT</span></div>
<div class="head"><div><div class="brand">PULSE</div><div class="sub" id="sub">KRAKEN BOOK</div></div><button class="close" id="refresh">REFRESH</button></div>
<div class="search"><input id="q" placeholder="Search BTC, NVDA, CEO" autocomplete="off"/><button id="go">GO</button></div>
<div class="chips" id="chips"></div><div class="screen" id="screen"></div></div><div id="sheet"></div>
<script>
const PAIRS=["BTC-USD","ETH-USD","SOL-USD","XRP-USD","DOGE-USD","AVAX-USD","LINK-USD","LTC-USD"];
const NAMES={BTC:"Bitcoin",ETH:"Ether",SOL:"Solana",XRP:"XRP",DOGE:"Dogecoin",AVAX:"Avalanche",LINK:"Chainlink",LTC:"Litecoin"};
const STOCKS=[{s:"NVDA",n:"NVIDIA",p:227.21,ch:-0.72,hi:234.76,lo:190},{s:"META",n:"Meta",p:738.79,ch:3.24,hi:779.82,lo:524},{s:"AAPL",n:"Apple",p:329.4,ch:-2.66,hi:345.34,lo:300},{s:"MSFT",n:"Microsoft",p:508.96,ch:-0.05,hi:519.4,lo:373},{s:"AVGO",n:"Broadcom",p:355.1,ch:1.58,hi:432.73,lo:336},{s:"GME",n:"GameStop",p:22.4,ch:0.4,hi:28,lo:18}];
const WHO=[{s:"NVDA",who:"Mark Stevens",role:"DIR",side:"SELL",qty:1366000,px:219.73},{s:"NVDA",who:"Colette Kress",role:"CFO",side:"SELL",qty:34918,px:219.05},{s:"META",who:"Mark Zuckerberg",role:"CEO",side:"SELL",qty:27474,px:777.44},{s:"MSFT",who:"Amy Hood",role:"CFO",side:"SELL",qty:41674,px:498.27},{s:"AVGO",who:"Henry Samueli",role:"DIR",side:"SELL",qty:702190,px:356.04},{s:"GME",who:"4 insiders",role:"CLUSTER",side:"BUY",qty:2683435,px:21.97}];
let book={},fib=true,cut="ALL",q="",openSym=null;
const $=id=>document.getElementById(id);
function heat(ch){if(ch>=2)return"HOT";if(ch>=0)return"WARM";if(ch>-2)return"COLD";return"ICE";}
function items(){const stocks=STOCKS.map(s=>({...s,kind:"STOCK",bid:s.p,ask:s.p,src:"desk"}));let all=[...Object.values(book),...stocks];const query=q.trim().toUpperCase();if(query)all=all.filter(x=>x.s.includes(query)||(x.n||"").toUpperCase().includes(query)||WHO.some(w=>w.s===x.s&&w.who.toUpperCase().includes(query)));if(cut==="HOT")all=all.filter(x=>(x.ch||0)>=0);if(cut==="COLD")all=all.filter(x=>(x.ch||0)<0);if(cut==="KRAKEN")all=all.filter(x=>x.kind==="CRYPTO");if(cut==="BUY")all=all.filter(x=>WHO.some(w=>w.s===x.s&&w.side==="BUY"));if(cut==="SELL")all=all.filter(x=>WHO.some(w=>w.s===x.s&&w.side==="SELL"));return all.sort((a,b)=>Math.abs(b.ch||0)-Math.abs(a.ch||0));}
function render(){$("chips").innerHTML=["ALL","HOT","COLD","KRAKEN","BUY","SELL"].map(k=>'<button data-k="'+k+'" class="'+(cut===k?"on":"")+'">'+k+"</button>").join("");$("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{cut=b.dataset.k;render();});const list=items();$("screen").innerHTML='<div class="grid">'+(list.map(x=>{const h=heat(x.ch||0);return '<button class="card" data-s="'+x.s+'"><div class="sym">'+x.s+'</div><div class="px">'+Number(x.p).toLocaleString(undefined,{maximumFractionDigits:x.p<5?4:2})+'</div><div class="'+((x.ch||0)>=0?"buy":"sell")+'">'+(x.ch||0).toFixed(2)+'%</div><span class="tag '+h+'">'+h+'</span></button>';}).join("")||"<div class='muted'>Nothing in this cut.</div>")+'</div>';document.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>openSheet(el.dataset.s));}
function chart(x){const hi=x.hi||x.p*1.01,lo=x.lo||x.p*0.99,pts=[lo,(lo+x.p)/2,x.p,hi,x.p],span=(hi-lo)||1,w=360,h=160,pad=16;const xy=pts.map((p,i)=>[pad+i/(pts.length-1)*(w-pad*2),pad+((Math.max(hi,x.p)-p)/span)*(h-pad*2)]);const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");const fibs=fib?[["0",hi],["0.382",hi-(hi-lo)*0.382],["0.5",(hi+lo)/2],["0.618",hi-(hi-lo)*0.618],["1",lo]]:[];const lines=fibs.map(([k,v])=>{const y=pad+((Math.max(hi,x.p)-v)/span)*(h-pad*2);return '<line x1="8" x2="'+(w-8)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(126,231,255,.35)"/><text x="10" y="'+Math.max(12,y-3)+'" fill="#9ad" font-size="10">'+k+" "+Number(v).toFixed(2)+"</text>";}).join("");return '<svg viewBox="0 0 '+w+' '+h+'"><path d="'+d+'" fill="none" stroke="#7ee7ff" stroke-width="2"/>'+lines+"</svg>";}
function openSheet(sym){openSym=sym;const x=Object.values(book).find(i=>i.s===sym)||STOCKS.find(i=>i.s===sym);if(!x)return;const who=WHO.filter(w=>w.s===sym);$("sheet").innerHTML='<div class="sheet"><div class="row"><div><div class="sym">'+x.s+" \u00b7 "+(x.n||"")+'</div><div class="muted">'+(x.src||"desk")+" \u00b7 "+heat(x.ch||0)+'</div></div><button class="close" id="x">CLOSE</button></div><div class="k"><div><b>'+Number(x.p).toLocaleString()+"</b><span class='muted'>LAST</span></div><div><b>"+(x.bid?Number(x.bid).toLocaleString():"-")+"</b><span class='muted'>BID</span></div><div><b>"+(x.ask?Number(x.ask).toLocaleString():"-")+"</b><span class='muted'>ASK</span></div></div><div class='muted'>24h high "+(x.hi||"-")+" \u00b7 low "+(x.lo||"-")+" \u00b7 spread "+(x.bid&&x.ask?(x.ask-x.bid).toFixed(2):"-")+"</div><div class='chips' style='padding:8px 0'><button id='fibOn' class='"+(fib?"on":"")+"'>FIB</button><button id='fibOff' class='"+(fib?"":"on")+"'>CLEAN</button></div>"+chart(x)+(who.map(w=>"<div class='row' style='margin-top:8px'><div>"+w.who+"<div class='muted'>"+w.role+" \u00b7 "+w.qty.toLocaleString()+" @ "+w.px+"</div></div><b class='"+(w.side==="BUY"?"buy":"sell")+"'>"+w.side+"</b></div>").join("")||"<div class='muted'>No named Form 4 on this name.</div>")+"</div>";$("x").onclick=()=>{openSym=null;$("sheet").innerHTML="";};$("fibOn").onclick=()=>{fib=true;openSheet(sym);};$("fibOff").onclick=()=>{fib=false;openSheet(sym);};}
async function loadKraken(){const map={BTC:"XBT",ETH:"ETH",SOL:"SOL",XRP:"XRP",DOGE:"XDG",AVAX:"AVAX",LINK:"LINK",LTC:"LTC"};const pair=Object.values(map).map(s=>s+"USD").join(",");const json=await fetch("https://api.kraken.com/0/public/Ticker?pair="+pair).then(r=>r.json());if(!json.result)throw new Error("no");const out={};for(const [k,v] of Object.entries(json.result)){let base=k.replace("ZUSD","").replace("USD","");if(base.startsWith("XX"))base=base.slice(1);if(base.startsWith("X")&&base.length>3)base=base.slice(1);const sym=base==="XBT"?"BTC":base==="XDG"?"DOGE":base;const last=+v.c[0],open=+v.o;out[sym]={s:sym,n:NAMES[sym]||sym,p:last,ch:open?(last/open-1)*100:0,hi:+v.h[1],lo:+v.l[1],bid:+v.b[0],ask:+v.a[0],kind:"CRYPTO",src:"Kraken"};}return out;}
async function loadCoinbase(){const out={};await Promise.all(PAIRS.map(async pair=>{const sym=pair.split("-")[0];const [t,s]=await Promise.all([fetch("https://api.exchange.coinbase.com/products/"+pair+"/ticker").then(r=>r.json()),fetch("https://api.exchange.coinbase.com/products/"+pair+"/stats").then(r=>r.json())]);const last=+t.price,open=+s.open;out[sym]={s:sym,n:NAMES[sym],p:last,ch:open?(last/open-1)*100:0,hi:+s.high,lo:+s.low,bid:+t.bid,ask:+t.ask,kind:"CRYPTO",src:"Coinbase book"};}));return out;}
async function refresh(){$("src").textContent="SYNC";try{book=await loadKraken();$("src").textContent="KRAKEN";$("sub").textContent="KRAKEN LIVE BID / ASK";}catch(e){try{book=await loadCoinbase();$("src").textContent="LIVE";$("sub").textContent="KRAKEN BLOCKED IN SAFARI \u00b7 COINBASE BOOK";}catch(err){$("src").textContent="STALE";}}render();if(openSym)openSheet(openSym);}
function fit(){const h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty("--vh",h+"px");$("size").textContent=(screen.width||innerWidth)+"x"+(screen.height||innerHeight);const now=new Date();$("clock").textContent=((now.getHours()+11)%12+1)+":"+String(now.getMinutes()).padStart(2,"0");}
fit();addEventListener("resize",fit);if(window.visualViewport)visualViewport.addEventListener("resize",fit);$("refresh").onclick=refresh;$("go").onclick=()=>{q=$("q").value;render();};$("q").oninput=()=>{q=$("q").value;render();};refresh();setInterval(refresh,20000);
</script></body></html>
