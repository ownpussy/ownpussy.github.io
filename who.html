<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#070708"/>
<title>PULSE</title>
<style>
:root{--buy:#3dffb0;--sell:#ff5a6a;--warm:#ffd56a;--ice:#7ec8ff;--line:rgba(214,220,230,.16);--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);--vh:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#000;color:#e8eaee;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.app{height:var(--vh);display:flex;flex-direction:column;background:repeating-linear-gradient(135deg,#121318 0 2px,#0c0d10 2px 4px),#090a0d}
.status{padding:calc(8px + var(--safe-top)) 14px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:650}.live{color:#7ee7ff}
.head{padding:4px 14px 6px;display:flex;justify-content:space-between;align-items:flex-end}.brand{font-size:26px;letter-spacing:.18em;font-weight:750;background:linear-gradient(180deg,#fff,#8e96a3);-webkit-background-clip:text;color:transparent}.sub{font-size:10px;letter-spacing:.14em;color:#8b909a}.close{border:0;background:transparent;color:#9ad;font-weight:750}
.tape{padding:0 12px 8px}.tape h2{margin:0 0 6px;font-size:11px;letter-spacing:.16em;color:#7ee7ff}
.hit{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px;background:rgba(8,9,12,.72)}
.who{font-weight:750}.role{font-size:10px;letter-spacing:.08em;color:#ffd56a}.buy{color:var(--buy)}.sell{color:var(--sell)}
.search{margin:0 12px 8px;display:flex;gap:8px}.search input{flex:1;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;padding:11px;font-size:16px}.search button{border:0;border-radius:12px;padding:0 12px;font-weight:800;background:linear-gradient(180deg,#f4f5f7,#9aa0ab);color:#111}
.chips{display:flex;gap:6px;overflow:auto;padding:0 12px 8px}.chips button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#c5c9d1;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;letter-spacing:.06em;white-space:nowrap}.chips button.on{color:#111;background:linear-gradient(180deg,#fff,#b7bcc6)}
.screen{flex:1;overflow:auto;padding:0 12px calc(14px + var(--safe-bot))}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:14px;background:rgba(8,9,12,.72);padding:11px;color:inherit;width:100%;text-align:left}.sym{font-weight:750}.px{font-variant-numeric:tabular-nums;font-weight:700;margin-top:3px}
.tag{display:inline-block;margin-top:6px;font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px}.HOT{background:rgba(255,90,106,.16);color:#ff8b96}.WARM{background:rgba(255,213,106,.14);color:var(--warm)}.COLD{background:rgba(126,200,255,.14);color:var(--ice)}.LEAN{background:rgba(61,255,176,.16);color:var(--buy)}.WATCH{background:rgba(255,213,106,.14);color:var(--warm)}.AVOID{background:rgba(255,90,106,.16);color:#ff8b96}
.sheet{position:fixed;inset:auto 0 0 0;max-height:82vh;overflow:auto;background:#101114;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + var(--safe-bot))}.row{display:flex;justify-content:space-between;gap:8px}.muted{color:#8b909a;font-size:12px;line-height:1.35}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.k div{border:1px solid var(--line);border-radius:10px;padding:8px}.k b{display:block}svg{width:100%;height:190px}
</style></head><body><div class="app">
<div class="status"><span id="clock">-</span><span class="live" id="src">LIVE</span><span id="size">FIT</span></div>
<div class="head"><div><div class="brand">PULSE</div><div class="sub" id="sub">WHO / SUPPORT / RESIST</div></div><button class="close" id="refresh">REFRESH</button></div>
<div class="tape"><h2>MOST RECENT / WHO</h2><div id="tape"></div></div>
<div class="search"><input id="q" placeholder="Ticker, name, CEO" autocomplete="off"/><button id="go">GO</button></div>
<div class="chips" id="chips"></div><div class="screen" id="screen"></div></div><div id="sheet"></div>
<script>
const PAIRS=["BTC-USD","ETH-USD","SOL-USD","XRP-USD","DOGE-USD","LINK-USD","LTC-USD","AVAX-USD"];
const NAMES={BTC:"Bitcoin",ETH:"Ether",SOL:"Solana",XRP:"XRP",DOGE:"Dogecoin",LINK:"Chainlink",LTC:"Litecoin",AVAX:"Avalanche"};
const STOCKS=[{s:"NVDA",n:"NVIDIA",p:227.21,ch:-0.72,hi:234.76,lo:190},{s:"META",n:"Meta",p:738.79,ch:3.24,hi:779.82,lo:524},{s:"AAPL",n:"Apple",p:329.4,ch:-2.66,hi:345.34,lo:300},{s:"MSFT",n:"Microsoft",p:508.96,ch:-0.05,hi:519.4,lo:373},{s:"AVGO",n:"Broadcom",p:355.1,ch:1.58,hi:432.73,lo:336},{s:"GME",n:"GameStop",p:22.4,ch:0.4,hi:28,lo:18}];
const WHO=[{s:"META",who:"Javier Olivan",role:"COO",side:"SELL",qty:1575,px:749.82,dt:"09-28"},{s:"META",who:"Mark Zuckerberg",role:"CEO",side:"SELL",qty:27474,px:777.44,dt:"09-24"},{s:"AVGO",who:"Henry Samueli",role:"DIR",side:"SELL",qty:702190,px:356.04,dt:"09-23"},{s:"AAPL",who:"Jennifer Newstead",role:"GC",side:"SELL",qty:2399,px:340.06,dt:"09-22"},{s:"META",who:"Christopher Cox",role:"CPO",side:"SELL",qty:40000,px:712.76,dt:"09-21"},{s:"NVDA",who:"Timothy Teter",role:"GC",side:"SELL",qty:30460,px:222.80,dt:"09-21"},{s:"NVDA",who:"Mark Stevens",role:"DIR",side:"SELL",qty:1366000,px:219.73,dt:"09-18"},{s:"NVDA",who:"Colette Kress",role:"CFO",side:"SELL",qty:34918,px:219.05,dt:"09-17"},{s:"MSFT",who:"Amy Hood",role:"CFO",side:"SELL",qty:41674,px:498.27,dt:"09-14"},{s:"GME",who:"4 insiders",role:"CLUSTER",side:"BUY",qty:2683435,px:21.97,dt:"09-08"},{s:"NVDA",who:"Pelosi spouse",role:"CONGRESS",side:"BUY",qty:0,px:0,dt:"01-15"},{s:"NVDA",who:"Sheldon Whitehouse",role:"CONGRESS",side:"SELL",qty:0,px:0,dt:"05-08"}];
let book={},cut="ALL",q="",fib=true,sr=true,openSym=null;const $=id=>document.getElementById(id);
function call(x){const w=WHO.filter(t=>t.s===x.s),buys=w.filter(t=>t.side==="BUY").length,sells=w.filter(t=>t.side==="SELL").length,pos=(x.p-x.lo)/((x.hi-x.lo)||1);if(buys&&pos<0.4)return ["LEAN","Buy cluster, sitting near support."];if(sells>=2&&pos>0.7)return ["AVOID","Officers selling into resistance."];if(sells&&pos>0.55)return ["WATCH","Selling into the top of the range."];if((x.ch||0)>=2)return ["WATCH","Hot tape. No fresh insider buy."];return ["WATCH","No clean buy cluster. Wait for support."];}
function items(){const stocks=STOCKS.map(s=>({...s,kind:"STOCK",bid:s.p,ask:s.p,src:"desk"}));let all=[...Object.values(book),...stocks];const query=q.trim().toUpperCase();if(query)all=all.filter(x=>x.s.includes(query)||(x.n||"").toUpperCase().includes(query)||WHO.some(w=>w.s===x.s&&w.who.toUpperCase().includes(query)));if(cut==="HOT")all=all.filter(x=>(x.ch||0)>=0);if(cut==="COLD")all=all.filter(x=>(x.ch||0)<0);if(cut==="KRAKEN")all=all.filter(x=>x.kind==="CRYPTO");if(cut==="BUY")all=all.filter(x=>WHO.some(w=>w.s===x.s&&w.side==="BUY"));if(cut==="SELL")all=all.filter(x=>WHO.some(w=>w.s===x.s&&w.side==="SELL"));return all;}
function tape(){const query=q.trim().toUpperCase();const rows=WHO.filter(w=>!query||w.s.includes(query)||w.who.toUpperCase().includes(query)||w.role.includes(query)).slice(0,5);$("tape").innerHTML=rows.map(w=>'<div class="hit" data-s="'+w.s+'"><div><div class="who">'+w.s+" \u00b7 "+w.who+'</div><div class="role">'+w.role+" \u00b7 "+w.dt+'</div></div><div style="text-align:right"><b class="'+(w.side==="BUY"?"buy":"sell")+'">'+w.side+'</b><div class="muted">'+(w.qty?w.qty.toLocaleString()+" @ "+w.px:"range")+"</div></div></div>").join("");$("tape").querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>openSheet(el.dataset.s));}
function render(){$("chips").innerHTML=["ALL","HOT","COLD","BUY","SELL","KRAKEN"].map(k=>'<button data-k="'+k+'" class="'+(cut===k?"on":"")+'">'+k+"</button>").join("");$("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{cut=b.dataset.k;render();});tape();$("screen").innerHTML='<div class="grid">'+items().map(x=>{const c=call(x),last=WHO.find(w=>w.s===x.s);return '<button class="card" data-s="'+x.s+'"><div class="sym">'+x.s+'</div><div class="px">'+Number(x.p).toLocaleString(undefined,{maximumFractionDigits:x.p<5?4:2})+'</div><div class="'+((x.ch||0)>=0?"buy":"sell")+'">'+(x.ch||0).toFixed(2)+'%</div><span class="tag '+c[0]+'">'+c[0]+'</span><div class="muted">'+(last?last.side+" "+last.who:"no print")+"</div></button>";}).join("")+"</div>";document.querySelectorAll(".card").forEach(el=>el.onclick=()=>openSheet(el.dataset.s));}
function chart(x){const hi=x.hi||x.p*1.02,lo=x.lo||x.p*0.98,pts=[lo,lo+(x.p-lo)*0.35,(hi+lo)/2,x.p,hi*0.98,x.p],top=Math.max(hi,x.p),bot=Math.min(lo,x.p),span=(top-bot)||1,w=360,h=170,pad=18;const y=v=>pad+((top-v)/span)*(h-pad*2);const xy=pts.map((p,i)=>[pad+i/(pts.length-1)*(w-pad*2),y(p)]);const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");let lines="";if(sr){lines+='<line x1="8" x2="'+(w-8)+'" y1="'+y(hi)+'" y2="'+y(hi)+'" stroke="#ff5a6a" stroke-dasharray="4 3"/><text x="10" y="'+(y(hi)-3)+'" fill="#ff8b96" font-size="10">R '+hi.toFixed(2)+"</text>";lines+='<line x1="8" x2="'+(w-8)+'" y1="'+y(lo)+'" y2="'+y(lo)+'" stroke="#3dffb0" stroke-dasharray="4 3"/><text x="10" y="'+(y(lo)-3)+'" fill="#3dffb0" font-size="10">S '+lo.toFixed(2)+"</text>";lines+='<line x1="20" y1="'+y(lo)+'" x2="'+(w-20)+'" y2="'+y(x.p)+'" stroke="#ffd56a" stroke-width="1.2"/>';}if(fib){[0,0.382,0.5,0.618,1].forEach(f=>{const v=hi-(hi-lo)*f,yy=y(v);lines+='<line x1="8" x2="'+(w-8)+'" y1="'+yy+'" y2="'+yy+'" stroke="rgba(126,231,255,.28)"/><text x="250" y="'+(yy-2)+'" fill="#9ad" font-size="10">'+f+"</text>";});}return '<svg viewBox="0 0 '+w+' '+h+'">'+lines+'<path d="'+d+'" fill="none" stroke="#7ee7ff" stroke-width="2"/><circle cx="'+xy[xy.length-1][0]+'" cy="'+xy[xy.length-1][1]+'" r="3.5" fill="#7ee7ff"/></svg>';}
function openSheet(sym){openSym=sym;const x=Object.values(book).find(i=>i.s===sym)||STOCKS.find(i=>i.s===sym);if(!x)return;const c=call(x),who=WHO.filter(w=>w.s===sym),pos=((x.p-x.lo)/((x.hi-x.lo)||1)*100).toFixed(0);$("sheet").innerHTML='<div class="sheet"><div class="row"><div><div class="sym">'+x.s+" \u00b7 "+(x.n||"")+'</div><div class="muted">'+(x.src||"desk")+" \u00b7 "+pos+'% of range</div></div><button class="close" id="x">CLOSE</button></div><span class="tag '+c[0]+'">'+c[0]+'</span><div class="muted">'+c[1]+' Not a trade.</div><div class="k"><div><b>'+Number(x.p).toLocaleString()+"</b><span class='muted'>LAST</span></div><div><b class='sell'>"+(x.hi||0).toLocaleString()+"</b><span class='muted'>RESIST</span></div><div><b class='buy'>"+(x.lo||0).toLocaleString()+"</b><span class='muted'>SUPPORT</span></div></div><div class='chips' style='padding:8px 0'><button id='srOn' class='"+(sr?"on":"")+"'>S/R</button><button id='fibOn' class='"+(fib?"on":"")+"'>FIB</button></div>"+chart(x)+"<div class='muted'>Red dash = resistance. Green dash = support. Gold = trend from support to last.</div>"+(who.map(w=>'<div class="hit"><div><div class="who">'+w.who+'</div><div class="role">'+w.role+" \u00b7 "+w.dt+'</div></div><div style="text-align:right"><b class="'+(w.side==="BUY"?"buy":"sell")+'">'+w.side+'</b><div class="muted">'+(w.qty?w.qty.toLocaleString()+" @ "+w.px:"range")+"</div></div></div>").join("")||"<div class='muted'>No named print.</div>")+"</div>";$("x").onclick=()=>{openSym=null;$("sheet").innerHTML="";};$("srOn").onclick=()=>{sr=!sr;openSheet(sym);};$("fibOn").onclick=()=>{fib=!fib;openSheet(sym);};}
async function loadKraken(){const map={BTC:"XBT",ETH:"ETH",SOL:"SOL",XRP:"XRP",DOGE:"XDG",LINK:"LINK",LTC:"LTC",AVAX:"AVAX"};const json=await fetch("https://api.kraken.com/0/public/Ticker?pair="+Object.values(map).map(s=>s+"USD").join(",")).then(r=>r.json());if(!json.result)throw new Error("no");const out={};for(const [k,v] of Object.entries(json.result)){let base=k.replace("ZUSD","").replace("USD","");if(base.startsWith("XX"))base=base.slice(1);if(base.startsWith("X")&&base.length>3)base=base.slice(1);const sym=base==="XBT"?"BTC":base==="XDG"?"DOGE":base;const last=+v.c[0],open=+v.o;out[sym]={s:sym,n:NAMES[sym]||sym,p:last,ch:open?(last/open-1)*100:0,hi:+v.h[1],lo:+v.l[1],bid:+v.b[0],ask:+v.a[0],kind:"CRYPTO",src:"Kraken"};}return out;}
async function loadCoinbase(){const out={};await Promise.all(PAIRS.map(async pair=>{const sym=pair.split("-")[0];const [t,s]=await Promise.all([fetch("https://api.exchange.coinbase.com/products/"+pair+"/ticker").then(r=>r.json()),fetch("https://api.exchange.coinbase.com/products/"+pair+"/stats").then(r=>r.json())]);const last=+t.price,open=+s.open;out[sym]={s:sym,n:NAMES[sym],p:last,ch:open?(last/open-1)*100:0,hi:+s.high,lo:+s.low,bid:+t.bid,ask:+t.ask,kind:"CRYPTO",src:"Coinbase book"};}));return out;}
async function refresh(){$("src").textContent="SYNC";try{book=await loadKraken();$("src").textContent="KRAKEN";$("sub").textContent="KRAKEN LIVE";}catch(e){try{book=await loadCoinbase();$("src").textContent="LIVE";$("sub").textContent="KRAKEN BLOCKED \u00b7 COINBASE BOOK";}catch(err){$("src").textContent="STALE";}}render();if(openSym)openSheet(openSym);}
function fit(){const h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty("--vh",h+"px");$("size").textContent=(screen.width||innerWidth)+"x"+(screen.height||innerHeight);const n=new Date();$("clock").textContent=((n.getHours()+11)%12+1)+":"+String(n.getMinutes()).padStart(2,"0");}
fit();addEventListener("resize",fit);if(window.visualViewport)visualViewport.addEventListener("resize",fit);$("refresh").onclick=refresh;$("go").onclick=()=>{q=$("q").value;render();};$("q").oninput=()=>{q=$("q").value;render();};refresh();setInterval(refresh,20000);
</script></body></html>
