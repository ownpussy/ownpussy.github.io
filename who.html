<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#070708"/>
<title>PULSE</title>
<style>
:root{--buy:#3dffb0;--sell:#ff5a6a;--warm:#ffd56a;--ice:#7ec8ff;--line:rgba(214,220,230,.16);--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);--vh:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#000;color:#e8eaee;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.app{height:var(--vh);display:flex;flex-direction:column;background:repeating-linear-gradient(135deg,#121318 0 2px,#0c0d10 2px 4px),#090a0d}
.status{padding:calc(8px + var(--safe-top)) 14px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:650}.live{color:#7ee7ff}
.head{padding:4px 14px 6px;display:flex;justify-content:space-between;align-items:flex-end}.brand{font-size:24px;letter-spacing:.16em;font-weight:750;background:linear-gradient(180deg,#fff,#8e96a3);-webkit-background-clip:text;color:transparent}.sub{font-size:10px;letter-spacing:.12em;color:#8b909a}.close{border:0;background:transparent;color:#9ad;font-weight:750}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 8px}.tabs button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#c5c9d1;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:800;letter-spacing:.06em}
.tabs button.on{color:#111;background:linear-gradient(180deg,#fff,#b7bcc6)}
.search{margin:0 12px 8px;display:flex;gap:8px}.search input{flex:1;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;padding:11px;font-size:16px}.search button{border:0;border-radius:12px;padding:0 12px;font-weight:800;background:linear-gradient(180deg,#f4f5f7,#9aa0ab);color:#111}
.screen{flex:1;overflow:auto;padding:0 12px calc(14px + var(--safe-bot))}
.rowcard{width:100%;text-align:left;color:inherit;border:1px solid var(--line);border-radius:14px;background:rgba(8,9,12,.72);padding:10px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:center}.sym{font-weight:750}.buy{color:var(--buy)}.sell{color:var(--sell)}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.cell{border:1px solid var(--line);border-radius:8px;padding:6px}.cell b{display:block;font-size:12px;font-variant-numeric:tabular-nums}.cell span{font-size:9px;letter-spacing:.08em;color:#8b909a}
.muted{color:#8b909a;font-size:12px;line-height:1.35}.sheet{position:fixed;inset:auto 0 0 0;max-height:84vh;overflow:auto;background:#101114;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + var(--safe-bot))}svg{width:100%;height:160px}
</style></head><body><div class="app">
<div class="status"><span id="clock">-</span><span class="live" id="src">LIVE</span><span id="size">FIT</span></div>
<div class="head"><div><div class="brand">PULSE</div><div class="sub" id="sub">GAIN / QTY / PRICE</div></div><button class="close" id="refresh">REFRESH</button></div>
<div class="tabs" id="tabs"></div>
<div class="search"><input id="q" placeholder="Search ticker or name" autocomplete="off"/><button id="go">GO</button></div>
<div class="screen" id="screen"></div></div><div id="sheet"></div>
<script>
const PAIRS=["BTC-USD","ETH-USD","SOL-USD","XRP-USD","DOGE-USD","LINK-USD","LTC-USD","AVAX-USD","ADA-USD","BCH-USD"];
const NAMES={BTC:"Bitcoin",ETH:"Ether",SOL:"Solana",XRP:"XRP",DOGE:"Dogecoin",LINK:"Chainlink",LTC:"Litecoin",AVAX:"Avalanche",ADA:"Cardano",BCH:"Bitcoin Cash"};
const STOCKS=[{s:"NVDA",n:"NVIDIA",p:227.21,open:228.86,hi:234.76,lo:190,vol:0},{s:"META",n:"Meta",p:738.79,open:715.6,hi:779.82,lo:524,vol:0},{s:"AAPL",n:"Apple",p:329.4,open:338.4,hi:345.34,lo:300,vol:0},{s:"MSFT",n:"Microsoft",p:508.96,open:509.2,hi:519.4,lo:373,vol:0},{s:"AVGO",n:"Broadcom",p:355.1,open:349.6,hi:432.73,lo:336,vol:0},{s:"GME",n:"GameStop",p:22.4,open:22.31,hi:28,lo:18,vol:0}];
const WHO=[{s:"META",who:"Javier Olivan",role:"COO",side:"SELL",qty:1575,px:749.82,dt:"09-28"},{s:"META",who:"Mark Zuckerberg",role:"CEO",side:"SELL",qty:27474,px:777.44,dt:"09-24"},{s:"AVGO",who:"Henry Samueli",role:"DIR",side:"SELL",qty:702190,px:356.04,dt:"09-23"},{s:"AAPL",who:"Jennifer Newstead",role:"GC",side:"SELL",qty:2399,px:340.06,dt:"09-22"},{s:"META",who:"Christopher Cox",role:"CPO",side:"SELL",qty:40000,px:712.76,dt:"09-21"},{s:"NVDA",who:"Timothy Teter",role:"GC",side:"SELL",qty:30460,px:222.80,dt:"09-21"},{s:"NVDA",who:"Mark Stevens",role:"DIR",side:"SELL",qty:1366000,px:219.73,dt:"09-18"},{s:"NVDA",who:"Colette Kress",role:"CFO",side:"SELL",qty:34918,px:219.05,dt:"09-17"},{s:"MSFT",who:"Amy Hood",role:"CFO",side:"SELL",qty:41674,px:498.27,dt:"09-14"},{s:"PLTR",who:"Alexander Moore",role:"DIR",side:"SELL",qty:16000,px:172.64,dt:"09-15"},{s:"TSLA",who:"Vaibhav Taneja",role:"CFO",side:"SELL",qty:2606,px:360.13,dt:"09-08"},{s:"GME",who:"4 insiders",role:"CLUSTER",side:"BUY",qty:2683435,px:21.97,dt:"09-08"}];
let book={},view="MOVERS",q="",openSym=null,sr=true,fib=false;
const $=id=>document.getElementById(id);
function money(n){const s=n<0?"-":"";n=Math.abs(n);if(n>=1e9)return s+"$"+(n/1e9).toFixed(2)+"B";if(n>=1e6)return s+"$"+(n/1e6).toFixed(1)+"M";if(n>=1e3)return s+"$"+(n/1e3).toFixed(1)+"k";return s+"$"+n.toFixed(2);}
function qty(n){if(!n)return "range";if(n>=1e6)return (n/1e6).toFixed(2)+"M";if(n>=1e3)return (n/1e3).toFixed(1)+"k";return n.toLocaleString();}
function px(n){if(n>=1000)return n.toLocaleString(undefined,{maximumFractionDigits:0});if(n>=1)return n.toFixed(2);return n.toFixed(4);}
function universe(){const stocks=STOCKS.map(s=>{const ch=(s.p/s.open-1)*100;return {...s,ch,gain:s.p-s.open,kind:"STOCK",src:"desk"};});return [...Object.values(book),...stocks];}
function match(s){const query=q.trim().toUpperCase();return !query||s.includes(query);}
function cells(vals){return '<div class="cells">'+vals.map(([b,l,cls])=>'<div class="cell"><b class="'+(cls||"")+'">'+b+'</b><span>'+l+'</span></div>').join("")+'</div>';}
function render(){
 $("tabs").innerHTML=["MOVERS","LOSERS","WHO","FILLS"].map(k=>'<button data-k="'+k+'" class="'+(view===k?"on":"")+'">'+k+"</button>").join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.k;render();});
 let html="";
 if(view==="MOVERS"||view==="LOSERS"){
  let rows=universe().filter(x=>match(x.s)||match(x.n||""));
  rows=rows.sort((a,b)=>view==="MOVERS"?b.ch-a.ch:a.ch-b.ch);
  html=rows.map((x,i)=>'<button class="rowcard" data-s="'+x.s+'"><div class="top"><div class="sym">'+(i+1)+"  "+x.s+"</div><div class="'+(x.ch>=0?"buy":"sell")+'">'+x.ch.toFixed(2)+"%</div></div><div class='muted'>"+(x.n||"")+" \u00b7 "+(x.src||"")+"</div>"+cells([[px(x.p),"LAST"],[money(x.gain),"$ GAIN",x.gain>=0?"buy":"sell"],[x.ch.toFixed(2)+"%","% "+(x.ch>=0?"GAIN":"LOSS"),x.ch>=0?"buy":"sell"],[qty(x.vol||0),"VOLUME"]])+"</button>").join("");
 }
 if(view==="WHO"){
  const rows=WHO.filter(w=>match(w.s)||match(w.who)||match(w.role));
  html=rows.map(w=>'<button class="rowcard" data-s="'+w.s+'"><div class="top"><div class="sym">'+w.s+" \u00b7 "+w.who+"</div><b class="'+(w.side==="BUY"?"buy":"sell")+'">'+w.side+"</b></div><div class='muted'>"+w.role+" \u00b7 sold/bought "+w.dt+"</div>"+cells([[qty(w.qty),"QTY"],[w.px?"$"+w.px.toFixed(2):"range","PRICE"],[w.qty&&w.px?money(w.qty*w.px):"range","VALUE",w.side==="BUY"?"buy":"sell"],[w.side,"SIDE",w.side==="BUY"?"buy":"sell"]])+"</button>").join("");
 }
 if(view==="FILLS"){
  const rows=WHO.filter(w=>match(w.s)||match(w.who));
  html='<div class="cells" style="margin-bottom:8px">'+rows.slice(0,8).map(w=>'<div class="cell"><b class="'+(w.side==="BUY"?"buy":"sell")+'">'+qty(w.qty)+'</b><span>'+w.s+" @ "+(w.px||"rng")+"</span></div>").join("")+'</div>'+rows.map(w=>'<button class="rowcard" data-s="'+w.s+'"><div class="sym">'+w.who+"</div><div class='muted'>"+w.s+" \u00b7 "+w.role+" \u00b7 "+w.dt+" \u00b7 "+w.side+"</div>"+cells([[qty(w.qty),"SHARES"],[w.px?"$"+px(w.px):"range","FILL PRICE"],[w.qty&&w.px?money(w.qty*w.px):"range","DOLLARS"],[w.side,"SIDE"]])+"</button>").join("");
 }
 $("screen").innerHTML=html||"<div class='muted'>Nothing in this cut.</div>";
 document.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>openSheet(el.dataset.s));
}
function chart(x){const hi=x.hi||x.p*1.02,lo=x.lo||x.p*0.98,pts=[lo,(lo+x.p)/2,x.p,hi,x.p],top=Math.max(hi,x.p),bot=Math.min(lo,x.p),span=(top-bot)||1,w=360,h=150,pad=16;const y=v=>pad+((top-v)/span)*(h-pad*2);const xy=pts.map((p,i)=>[pad+i/(pts.length-1)*(w-pad*2),y(p)]);const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");let lines="";if(sr){lines+='<line x1="8" x2="'+(w-8)+'" y1="'+y(hi)+'" y2="'+y(hi)+'" stroke="#ff5a6a" stroke-dasharray="4 3"/><text x="10" y="'+(y(hi)-3)+'" fill="#ff8b96" font-size="10">R '+hi.toFixed(2)+"</text>";lines+='<line x1="8" x2="'+(w-8)+'" y1="'+y(lo)+'" y2="'+y(lo)+'" stroke="#3dffb0" stroke-dasharray="4 3"/><text x="10" y="'+(y(lo)-3)+'" fill="#3dffb0" font-size="10">S '+lo.toFixed(2)+"</text>";}if(fib){[0.382,0.5,0.618].forEach(f=>{const v=hi-(hi-lo)*f;lines+='<line x1="8" x2="'+(w-8)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="rgba(126,231,255,.3)"/>';});}return '<svg viewBox="0 0 '+w+' '+h+'">'+lines+'<path d="'+d+'" fill="none" stroke="#7ee7ff" stroke-width="2"/></svg>';}
function openSheet(sym){openSym=sym;const x=universe().find(i=>i.s===sym);if(!x){return;}const fills=WHO.filter(w=>w.s===sym);$("sheet").innerHTML='<div class="sheet"><div class="top"><div class="sym">'+x.s+" \u00b7 "+(x.n||sym)+"</div><button class="close" id="x">CLOSE</button></div><div class='muted'>Tap back through the boards. Red dash resistance, green dash support.</div>"+cells([[px(x.p),"LAST"],[money(x.gain),"$ GAIN",x.gain>=0?"buy":"sell"],[x.ch.toFixed(2)+"%","% CHANGE",x.ch>=0?"buy":"sell"],[px(x.hi),"HIGH"],[px(x.lo),"LOW"],[qty(x.vol||0),"VOLUME"]])+'<div style="display:flex;gap:8px;margin:8px 0"><button class="close" id="srOn">S/R</button><button class="close" id="fibOn">FIB</button></div>'+chart(x)+fills.map(w=>'<div class="rowcard"><div class="sym">'+w.who+"</div><div class='muted'>"+w.role+" \u00b7 "+w.dt+" \u00b7 "+w.side+" at $"+(w.px||"range")+"</div>"+cells([[qty(w.qty),"QTY"],[w.px?"$"+w.px.toFixed(2):"range","SOLD/BOUGHT"],[w.qty&&w.px?money(w.qty*w.px):"range","DOLLARS",w.side==="BUY"?"buy":"sell"],[w.side,"SIDE"]])+"</div>").join("")+"</div>";$("x").onclick=()=>{openSym=null;$("sheet").innerHTML="";};$("srOn").onclick=()=>{sr=!sr;openSheet(sym);};$("fibOn").onclick=()=>{fib=!fib;openSheet(sym);};}
async function loadCoinbase(){const out={};await Promise.all(PAIRS.map(async pair=>{const sym=pair.split("-")[0];const [t,s]=await Promise.all([fetch("https://api.exchange.coinbase.com/products/"+pair+"/ticker").then(r=>r.json()),fetch("https://api.exchange.coinbase.com/products/"+pair+"/stats").then(r=>r.json())]);const last=+t.price,open=+s.open||last;out[sym]={s:sym,n:NAMES[sym],p:last,open,ch:open?(last/open-1)*100:0,gain:last-open,hi:+s.high,lo:+s.low,vol:+s.volume,kind:"CRYPTO",src:"Coinbase"};}));return out;}
async function refresh(){$("src").textContent="SYNC";try{book=await loadCoinbase();$("src").textContent="LIVE";$("sub").textContent="24H GAIN / LOSS \u00b7 QTY \u00b7 PRICE";}catch(e){$("src").textContent="STALE";}render();if(openSym)openSheet(openSym);}
function fit(){const h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty("--vh",h+"px");$("size").textContent=(screen.width||innerWidth)+"x"+(screen.height||innerHeight);const n=new Date();$("clock").textContent=((n.getHours()+11)%12+1)+":"+String(n.getMinutes()).padStart(2,"0");}
fit();addEventListener("resize",fit);if(window.visualViewport)visualViewport.addEventListener("resize",fit);$("refresh").onclick=refresh;$("go").onclick=()=>{q=$("q").value;render();};$("q").oninput=()=>{q=$("q").value;render();};refresh();setInterval(refresh,20000);
</script></body></html>
