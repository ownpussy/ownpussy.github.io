<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PULSE"/>
<meta name="theme-color" content="#0c0b09"/>
<title>PULSE DESK</title>
<style>
:root{--bg:#0c0b09;--ink:#efe8dc;--dim:#9a9184;--gold:#c4a574;--line:rgba(196,165,116,.28);--buy:#8fbfa8;--sell:#c47a6a;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);--vh:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#070706;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.app{min-height:var(--vh);height:var(--vh);display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,rgba(196,165,116,.08),transparent 50%),var(--bg)}
.top{padding:calc(10px + var(--safe-top)) 16px 8px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line)}
.mark{font-family:Georgia,Times,serif;font-size:22px;letter-spacing:.22em}.mark span{color:var(--gold)}.meta{text-align:right;font-size:10px;letter-spacing:.16em;color:var(--dim)}
.search{margin:10px 14px 0;display:flex;gap:8px}.search input{flex:1;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:10px 2px;font-size:16px}.search button{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:0 12px;letter-spacing:.14em;font-size:11px}
.filters,.sorts{display:flex;gap:6px;overflow:auto;padding:8px 14px 2px}.filters button,.sorts button{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:99px;padding:7px 11px;font-size:11px;letter-spacing:.12em;white-space:nowrap}
.filters button.on,.sorts button.on{color:#1a140c;background:var(--gold);border-color:var(--gold)}
.screen{flex:1;overflow:auto;padding:4px 14px calc(16px + var(--safe-bot))}
.blotter{width:100%;border-collapse:collapse}.blotter th{font-size:10px;letter-spacing:.14em;color:var(--gold);text-align:left;font-weight:500;padding:8px 0;border-bottom:1px solid var(--line)}
.blotter td{padding:12px 0;border-bottom:1px solid rgba(196,165,116,.12);vertical-align:top;font-size:13px}.r{text-align:right;font-variant-numeric:tabular-nums}.buy{color:var(--buy)}.sell{color:var(--sell)}
.who{font-weight:600}.role{font-size:10px;letter-spacing:.12em;color:var(--gold)}.note{color:var(--dim);font-size:11px;margin-top:3px;line-height:1.35}
.card{border:1px solid var(--line);padding:14px;margin:12px 0}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.kpi{border-top:1px solid var(--line);padding-top:6px}.kpi b{display:block;font-size:14px;font-weight:500}.kpi span{font-size:10px;letter-spacing:.12em;color:var(--dim)}
.toggle{display:flex;gap:8px;margin:8px 0}.toggle button{flex:1;border:1px solid var(--line);background:transparent;color:var(--dim);padding:9px;letter-spacing:.12em}.toggle button.on{color:#1a140c;background:var(--gold)}svg{width:100%;height:200px}.empty{padding:28px 0;color:var(--dim)}
</style></head><body><div class="app">
<div class="top"><div class="mark">PULSE <span>DESK</span></div><div class="meta" id="size">PRIVATE BOOK</div></div>
<div class="search"><input id="q" placeholder="Ticker, name, or role" autocomplete="off"/><button id="go">FIND</button></div>
<div class="filters" id="filters"></div><div class="sorts" id="sorts"></div><div class="screen" id="screen"></div></div>
<script>
const BOOK=[{s:"META",n:"Meta",p:738.79,hi:779.82,lo:524.49,px:[524,590,700,739]},{s:"MSFT",n:"Microsoft",p:508.96,hi:519.4,lo:373,px:[420,500,509]},{s:"NVDA",n:"NVIDIA",p:227.21,hi:234.76,lo:190,px:[190,220,227]},{s:"AAPL",n:"Apple",p:329.4,hi:345.34,lo:300,px:[300,340,329]},{s:"AMZN",n:"Amazon",p:246.67,hi:287.2,lo:226,px:[280,247]},{s:"GOOGL",n:"Alphabet",p:340.92,hi:384.48,lo:315,px:[370,341]},{s:"PLTR",n:"Palantir",p:186.97,hi:194.68,lo:118,px:[130,187]},{s:"AVGO",n:"Broadcom",p:355.1,hi:432.73,lo:336,px:[420,355]},{s:"TSLA",n:"Tesla",p:352.84,hi:419.56,lo:297,px:[400,353]},{s:"GME",n:"GameStop",p:22.4,hi:28,lo:18,px:[19,22.4]}];
const TRADES=[{s:"META",who:"Mark Zuckerberg",role:"CEO / 10%",side:"SELL",qty:27474,px:777.44,dt:"2026-09-24",note:"Sale after option exercise."},{s:"META",who:"Christopher Cox",role:"CPO",side:"SELL",qty:40000,px:712.76,dt:"2026-09-21",note:"Officer sale."},{s:"META",who:"Javier Olivan",role:"COO",side:"SELL",qty:1575,px:749.82,dt:"2026-09-28",note:"Officer sale, usually pay."},{s:"NVDA",who:"Mark Stevens",role:"DIR",side:"SELL",qty:1366000,px:219.73,dt:"2026-09-18",note:"Director, about $300M."},{s:"NVDA",who:"Colette Kress",role:"CFO",side:"SELL",qty:34918,px:219.05,dt:"2026-09-17",note:"CFO sale."},{s:"NVDA",who:"Timothy Teter",role:"GC",side:"SELL",qty:30460,px:222.80,dt:"2026-09-21",note:"Counsel sale."},{s:"MSFT",who:"Amy Hood",role:"CFO",side:"SELL",qty:41674,px:498.27,dt:"2026-09-14",note:"CFO sale, about $21M."},{s:"AVGO",who:"Henry Samueli",role:"DIR",side:"SELL",qty:702190,px:356.04,dt:"2026-09-23",note:"Director, about $250M."},{s:"AAPL",who:"Jennifer Newstead",role:"GC",side:"SELL",qty:2399,px:340.06,dt:"2026-09-22",note:"Counsel sale."},{s:"PLTR",who:"Alexander Moore",role:"DIR",side:"SELL",qty:16000,px:172.64,dt:"2026-09-15",note:"Director, not the CEO."},{s:"TSLA",who:"Vaibhav Taneja",role:"CFO",side:"SELL",qty:2606,px:360.13,dt:"2026-09-08",note:"CFO, option exercise."},{s:"GME",who:"4 insiders",role:"CLUSTER",side:"BUY",qty:2683435,px:21.97,dt:"2026-09-08",note:"Open cluster, about $59M."},{s:"NVDA",who:"Pelosi spouse",role:"CONGRESS",side:"BUY",qty:0,px:0,dt:"2026-01-15",note:"Range $250k-$500k."},{s:"NVDA",who:"Sheldon Whitehouse",role:"CONGRESS",side:"SELL",qty:0,px:0,dt:"2026-05-08",note:"Range $100k-$250k sell."},{s:"NVDA",who:"Ro Khanna",role:"CONGRESS",side:"BUY",qty:0,px:0,dt:"2026-06-05",note:"Range $1k-$15k."},{s:"AVGO",who:"Richard Allen",role:"CONGRESS",side:"BUY",qty:0,px:0,dt:"2026-08-12",note:"Range $1k-$15k buy."}];
const state={cut:"ALL",sort:"VALUE",q:"",fib:true,pick:"NVDA"};
const $=id=>document.getElementById(id);
function book(s){return BOOK.find(b=>b.s===s)||{s:s,p:0,hi:1,lo:0,n:s,px:[0,1]};}
function pos(s){const b=book(s);return (b.p-b.lo)/((b.hi-b.lo)||1);}
function value(t){return t.qty&&t.px?t.qty*t.px:0;}
function money(n){if(!n)return "range";if(n>=1e6)return "$"+(n/1e6).toFixed(1)+"M";return "$"+Math.round(n).toLocaleString();}
function rows(){const q=state.q.trim().toUpperCase();let list=TRADES.filter(t=>!q||t.s.includes(q)||t.who.toUpperCase().includes(q)||t.role.includes(q));if(state.cut==="BUY")list=list.filter(t=>t.side==="BUY");if(state.cut==="SELL")list=list.filter(t=>t.side==="SELL");if(state.cut==="HIGH")list=list.filter(t=>pos(t.s)>=0.7);if(state.cut==="LOW")list=list.filter(t=>pos(t.s)<=0.4);const srt={VALUE:(a,b)=>value(b)-value(a),QTY:(a,b)=>b.qty-a.qty,PRICE:(a,b)=>b.px-a.px,DATE:(a,b)=>b.dt.localeCompare(a.dt),HIGH:(a,b)=>pos(b.s)-pos(a.s),LOW:(a,b)=>pos(a.s)-pos(b.s)};return list.slice().sort(srt[state.sort]||srt.VALUE);}
function chips(id,items,key){$(id).innerHTML=items.map(([k,label])=>'<button data-k="'+k+'" class="'+(state[key]===k?"on":"")+'">'+label+"</button>").join("");$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{state[key]=b.dataset.k;render();});}
function chart(b){const pts=b.px,hi=Math.max(...pts,b.hi),lo=Math.min(...pts,b.lo),span=hi-lo||1,w=360,h=180,pad=18;const xy=pts.map((p,i)=>[pad+i/(pts.length-1)*(w-pad*2),pad+((hi-p)/span)*(h-pad*2)]);const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");const fibs=state.fib?[["0",b.hi],["0.382",b.hi-(b.hi-b.lo)*0.382],["0.5",(b.hi+b.lo)/2],["0.618",b.hi-(b.hi-b.lo)*0.618],["1",b.lo]]:[];const lines=fibs.map(([k,v])=>{const y=pad+((hi-v)/span)*(h-pad*2);return '<line x1="8" x2="'+(w-8)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(196,165,116,.35)"/><text x="10" y="'+(y-3)+'" fill="#c4a574" font-size="10">'+k+" "+v.toFixed(2)+"</text>";}).join("");return '<svg viewBox="0 0 '+w+' '+h+'"><path d="'+d+'" fill="none" stroke="#efe8dc" stroke-width="1.4"/>'+lines+'<circle cx="'+xy[xy.length-1][0]+'" cy="'+xy[xy.length-1][1]+'" r="3.5" fill="#c4a574"/></svg>';}
function render(){chips("filters",[["ALL","ALL"],["BUY","BUYS"],["SELL","SELLS"],["HIGH","NEAR HIGH"],["LOW","NEAR LOW"]],"cut");chips("sorts",[["VALUE","VALUE"],["QTY","SHARES"],["PRICE","PRICE"],["DATE","DATE"],["HIGH","HIGH FIRST"],["LOW","LOW FIRST"]],"sort");const list=rows();const bN=list.filter(t=>t.side==="BUY").length,sN=list.filter(t=>t.side==="SELL").length;const b=book(state.pick);$("screen").innerHTML='<div class="kpis"><div class="kpi"><b>'+list.length+'</b><span>PRINTS</span></div><div class="kpi"><b class="buy">'+bN+'</b><span>BUYS</span></div><div class="kpi"><b class="sell">'+sN+'</b><span>SELLS</span></div></div><table class="blotter"><thead><tr><th>NAME</th><th class="r">QTY</th><th class="r">PX</th></tr></thead><tbody>'+(list.map(t=>'<tr data-s="'+t.s+'"><td><div class="who">'+t.s+" \u00b7 "+t.who+'</div><div class="role">'+t.side+" \u00b7 "+t.role+" \u00b7 "+t.dt+'</div><div class="note">'+t.note+" "+money(value(t))+'</div></td><td class="r '+(t.side==="BUY"?"buy":"sell")+'">'+(t.qty?t.qty.toLocaleString():"\u2014")+'</td><td class="r">'+(t.px?t.px.toFixed(2):"range")+"</td></tr>").join("")||'<tr><td class="empty" colspan="3">Nothing in this cut.</td></tr>')+'</tbody></table><div class="card"><div class="who">'+b.s+" \u00b7 "+(b.n||"")+'</div><div class="note">Last '+b.p+" \u00b7 high "+b.hi+" \u00b7 low "+b.lo+" \u00b7 "+(pos(b.s)*100).toFixed(0)+'% of range</div><div class="toggle"><button id="fibOn" class="'+(state.fib?"on":"")+'">FIB</button><button id="fibOff" class="'+(state.fib?"":"on")+'">CLEAN</button></div>'+chart(b)+"</div>";document.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>{state.pick=el.dataset.s;render();});const on=$("fibOn"),off=$("fibOff");if(on)on.onclick=()=>{state.fib=true;render();};if(off)off.onclick=()=>{state.fib=false;render();};}
function fit(){const h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty("--vh",h+"px");$("size").innerHTML=(screen.width||innerWidth)+" \u00d7 "+(screen.height||innerHeight)+"<br>PRIVATE BOOK";}
function init(){fit();addEventListener("resize",fit);if(window.visualViewport)visualViewport.addEventListener("resize",fit);$("go").onclick=()=>{state.q=$("q").value;const u=state.q.trim().toUpperCase();if(BOOK.some(b=>b.s===u))state.pick=u;render();};$("q").oninput=()=>{state.q=$("q").value;render();};render();}init();
</script></body></html>
