<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PULSE"/>
<meta name="theme-color" content="#070708"/>
<title>PULSE</title>
<style>
:root{--buy:#3dffb0;--avoid:#ff5a6a;--watch:#ffd56a;--line:rgba(214,220,230,.16);--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);--vh:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#000;color:#e8eaee;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.app{min-height:var(--vh);height:var(--vh);display:flex;flex-direction:column;background:repeating-linear-gradient(135deg,#101114 0 2px,#0c0d10 2px 4px),#0a0b0e;overflow:hidden}
.status{padding:calc(8px + var(--safe-top)) 14px 4px;display:flex;justify-content:space-between;font-size:12px;font-weight:650}.live{color:#7ee7ff}
.header{padding:2px 14px 6px;display:flex;justify-content:space-between;align-items:flex-end}.brand{font-size:26px;letter-spacing:.16em;font-weight:750;background:linear-gradient(180deg,#fff,#9aa0ab);-webkit-background-clip:text;color:transparent}.sub{font-size:10px;letter-spacing:.18em;color:#8b909a}.fit{font-size:10px;color:#8b909a;text-align:right}
.search{margin:0 12px 8px;display:flex;gap:8px}.search input{flex:1;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;padding:12px;font-size:16px}.search button{border:0;border-radius:12px;padding:0 14px;font-weight:800;background:linear-gradient(180deg,#f3f4f6,#9aa0ab);color:#111}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 8px}.tabs button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#c5c9d1;border-radius:10px;padding:8px;font-size:12px;font-weight:800}.tabs button.on{color:#111;background:linear-gradient(180deg,#fff,#b7bcc6)}
.screen{flex:1;overflow:auto;padding:0 12px calc(18px + var(--safe-bot));-webkit-overflow-scrolling:touch}
.card,.block{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);padding:12px;margin-bottom:8px}.row{display:flex;justify-content:space-between;gap:8px}.sym{font-size:16px;font-weight:750}.muted{color:#8b909a;font-size:12px;line-height:1.35}
.side{font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px}.buy{background:rgba(61,255,176,.15);color:var(--buy)}.sell{background:rgba(255,90,106,.15);color:var(--avoid)}.role{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(255,213,106,.12);color:var(--watch)}.px{font-variant-numeric:tabular-nums;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.legend span{font-size:11px;color:#c5c9d1;border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.toggle{display:flex;gap:8px;margin:8px 0}.toggle button{flex:1;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#ddd;padding:10px;font-weight:750}.toggle button.on{color:#111;background:#dfe2e8}svg{width:100%;height:220px;display:block}.note{font-size:11px;color:#7a808a}
</style></head><body>
<div class="app"><div class="status"><span id="clock">—</span><span class="live">PULSE</span><span id="fit">iOS</span></div>
<div class="header"><div><div class="brand">PULSE</div><div class="sub">WHO · QTY · PRICE</div></div><div class="fit" id="size">fitting screen</div></div>
<div class="search"><input id="q" placeholder="Search ticker, name, CEO" inputmode="search" autocomplete="off"/><button id="go">GO</button></div>
<div class="tabs"><button class="on" data-tab="who">WHO</button><button data-tab="book">BOOK</button><button data-tab="chart">CHART</button></div>
<div class="screen" id="screen"></div></div>
<script>
const ROLES={CEO:"Runs the company. Open-market buy is the strongest tell. A scheduled sale is weaker.",CFO:"Runs the money. A CFO buy matters. A CFO sale is often pay.",PRES:"President. Day-to-day operator under the CEO.",COO:"Runs operations. Sale is usually pay. Buy is a real signal.",CPO:"Chief product. Sale is usually pay.",DIR:"Board director. Votes on the CEO, deals, and pay. Not the same as buying stock.",COB:"Chair of the board. Runs the board vote. Still not a buy.","10%":"Owns 10% or more. Their sale moves the tape. Their buy is conviction.",GC:"General counsel. Sale is usually pay.",CONGRESS:"House or Senate. STOCK Act ranges, often weeks late. Not a company insider.",VOTE:"A board vote is a decision. It is not a stock buy."};
const BOOK=[{s:"META",n:"Meta",p:738.79,d:3.24,hi:779.82,lo:524.49,px:[524,560,620,676,720,739]},{s:"MSFT",n:"Microsoft",p:508.96,d:-0.05,hi:519.4,lo:373,px:[420,470,500,512,509]},{s:"NVDA",n:"NVIDIA",p:227.21,d:-0.72,hi:234.76,lo:190,px:[190,210,223,232,227]},{s:"AAPL",n:"Apple",p:329.4,d:-2.66,hi:345.34,lo:300,px:[300,320,340,345,329]},{s:"AMZN",n:"Amazon",p:246.67,d:0.21,hi:287.2,lo:226,px:[280,262,250,247]},{s:"GOOGL",n:"Alphabet",p:340.92,d:-0.53,hi:384.48,lo:315,px:[370,350,342,341]},{s:"PLTR",n:"Palantir",p:186.97,d:-0.27,hi:194.68,lo:118,px:[130,166,182,187]},{s:"AVGO",n:"Broadcom",p:355.1,d:1.58,hi:432.73,lo:336,px:[420,370,355]},{s:"TSLA",n:"Tesla",p:352.84,d:-1.29,hi:419.56,lo:297,px:[400,360,353]},{s:"GME",n:"GameStop",p:22.4,d:0.4,hi:28,lo:18,px:[19,22,23,22.4]},{s:"IBIT",n:"Bitcoin ETF",p:47.33,d:0.25,hi:49.22,lo:34.8,px:[36,44,47.3]}];
const TRADES=[{s:"META",who:"Javier Olivan",role:"COO",side:"SELL",qty:1575,px:749.82,dt:"2026-09-28",note:"Officer sale. Usually pay, not a panic."},{s:"META",who:"Mark Zuckerberg",role:"COB",side:"SELL",qty:27474,px:777.44,dt:"2026-09-24",note:"CEO and 10% holder. Sale after option exercise."},{s:"META",who:"Christopher Cox",role:"CPO",side:"SELL",qty:40000,px:712.76,dt:"2026-09-21",note:"Product chief selling."},{s:"NVDA",who:"Colette Kress",role:"CFO",side:"SELL",qty:34918,px:219.05,dt:"2026-09-17",note:"CFO sale. Knows the books. Still often pay."},{s:"NVDA",who:"Timothy Teter",role:"GC",side:"SELL",qty:30460,px:222.80,dt:"2026-09-21",note:"General counsel sale."},{s:"NVDA",who:"Mark Stevens",role:"DIR",side:"SELL",qty:1366000,px:219.73,dt:"2026-09-18",note:"Director sold 1.37M shares, about $300M. Vote is separate."},{s:"AAPL",who:"Jennifer Newstead",role:"GC",side:"SELL",qty:2399,px:340.06,dt:"2026-09-22",note:"Counsel sale. Small vs the company."},{s:"MSFT",who:"Amy Hood",role:"CFO",side:"SELL",qty:41674,px:498.27,dt:"2026-09-14",note:"CFO sale, about $21M."},{s:"AVGO",who:"Henry Samueli",role:"DIR",side:"SELL",qty:702190,px:356.04,dt:"2026-09-23",note:"Director sold about $250M. Chart is weak."},{s:"PLTR",who:"Alexander Moore",role:"DIR",side:"SELL",qty:16000,px:172.64,dt:"2026-09-15",note:"Director sale. Not the CEO."},{s:"TSLA",who:"Vaibhav Taneja",role:"CFO",side:"SELL",qty:2606,px:360.13,dt:"2026-09-08",note:"CFO sale after option exercise."},{s:"GME",who:"Cluster, 4 insiders",role:"10%",side:"BUY",qty:2683435,px:21.97,dt:"2026-09-08",note:"OpenInsider cluster, about $59M. Grouped, not one CEO."},{s:"NVDA",who:"Nancy Pelosi (spouse)",role:"CONGRESS",side:"BUY",qty:0,px:0,dt:"2026-01-15",note:"STOCK Act range $250k-$500k. Not a share count."},{s:"NVDA",who:"Sheldon Whitehouse",role:"CONGRESS",side:"SELL",qty:0,px:0,dt:"2026-05-08",note:"STOCK Act range $100k-$250k sell. Late filing."},{s:"NVDA",who:"Ro Khanna",role:"CONGRESS",side:"BUY",qty:0,px:0,dt:"2026-06-05",note:"STOCK Act range $1k-$15k."},{s:"AVGO",who:"Richard Allen",role:"CONGRESS",side:"BUY",qty:0,px:0,dt:"2026-08-12",note:"STOCK Act range $1k-$15k buy."}];
const state={tab:"who",q:"",fib:true,pick:"META"};
const $=id=>document.getElementById(id);
function money(n){if(!n)return "range";if(n>=1e6)return "$"+(n/1e6).toFixed(1)+"M";return "$"+Math.round(n).toLocaleString();}
function fit(){const vv=window.visualViewport;const h=vv?vv.height:window.innerHeight;document.documentElement.style.setProperty("--vh",h+"px");$("size").textContent=(screen.width||innerWidth)+"x"+(screen.height||innerHeight)+" "+(devicePixelRatio||1)+"x";$("fit").textContent="FIT";}
function filteredTrades(){const q=state.q.trim().toUpperCase();return TRADES.filter(t=>!q||t.s.includes(q)||t.who.toUpperCase().includes(q)||t.role.includes(q));}
function filteredBook(){const q=state.q.trim().toUpperCase();return BOOK.filter(b=>!q||b.s.includes(q)||b.n.toUpperCase().includes(q));}
function chartSVG(b){const pts=b.px,hi=Math.max(...pts,b.hi),lo=Math.min(...pts,b.lo),span=hi-lo||1,w=360,h=200,pad=16;const xy=pts.map((p,i)=>[pad+(i/(pts.length-1))*(w-pad*2),pad+((hi-p)/span)*(h-pad*2)]);const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");const fibs=state.fib?[["0",b.hi],["0.382",b.hi-(b.hi-b.lo)*0.382],["0.5",b.hi-(b.hi-b.lo)*0.5],["0.618",b.hi-(b.hi-b.lo)*0.618],["1",b.lo]]:[];const lines=fibs.map(([k,v])=>{const y=pad+((hi-v)/span)*(h-pad*2);return '<line x1="8" x2="'+(w-8)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(200,210,230,.35)"/><text x="10" y="'+(y-3)+'" fill="#9aa0aa" font-size="10">'+k+" "+v.toFixed(2)+"</text>";}).join("");const last=xy[xy.length-1];return '<svg viewBox="0 0 '+w+' '+h+'"><path d="'+d+'" fill="none" stroke="#7ee7ff" stroke-width="2"/>'+lines+'<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="#7ee7ff"/></svg>';}
function render(){if(state.tab==="who"){const rows=filteredTrades();$("screen").innerHTML='<div class="block"><div class="sym">Who is buying / selling</div><p class="muted">CEO or CFO open-market buy is the clean tell. Most sales here are officers getting paid. Congress files ranges. A board vote is not a stock trade.</p><div class="legend">'+Object.entries(ROLES).map(([k,v])=>'<span><b>'+k+'</b> '+v.split(".")[0]+'</span>').join("")+'</div></div>'+(rows.map(t=>'<div class="card"><div class="row"><div><div class="sym">'+t.s+" · "+t.who+'</div><div class="muted">'+t.dt+' · <span class="role">'+t.role+'</span></div></div><span class="side '+(t.side==="BUY"?"buy":"sell")+'">'+t.side+'</span></div><div class="row" style="margin-top:8px"><div class="px">'+(t.qty?t.qty.toLocaleString()+" sh":"range")+'</div><div class="px">'+(t.px?("$"+t.px.toFixed(2)):"—")+'</div><div class="px">'+(t.qty?money(t.qty*t.px):"STOCK Act")+'</div></div><div class="muted" style="margin-top:6px">'+t.note+'</div></div>').join("")||'<div class="block">No match.</div>');}
if(state.tab==="book"){$("screen").innerHTML=filteredBook().map(b=>{const mine=TRADES.filter(t=>t.s===b.s);return '<button class="card" data-s="'+b.s+'" style="width:100%;text-align:left;color:inherit"><div class="row"><div class="sym">'+b.s+'</div><div class="px">'+b.p+'</div></div><div class="muted">'+b.n+' · high '+b.hi+' · low '+b.lo+' · buys '+mine.filter(t=>t.side==="BUY").length+' · sells '+mine.filter(t=>t.side==="SELL").length+'</div></button>';}).join("")||'<div class="block">No ticker.</div>';document.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>{state.pick=el.dataset.s;state.tab="chart";document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab==="chart"));render();});}
if(state.tab==="chart"){const b=BOOK.find(x=>x.s===state.pick)||filteredBook()[0]||BOOK[0];state.pick=b.s;const mine=TRADES.filter(t=>t.s===b.s);$("screen").innerHTML='<div class="block"><div class="row"><div><div class="sym">'+b.s+'</div><div class="muted">'+b.n+" · "+b.p+" · "+b.d+'%</div></div><div class="muted">high '+b.hi+'<br>low '+b.lo+'</div></div><div class="toggle"><button id="fibOn" class="'+(state.fib?"on":"")+'">FIB ON</button><button id="fibOff" class="'+(state.fib?"":"on")+'">FIB OFF</button></div>'+chartSVG(b)+'<p class="note">0 is the swing high, 1 is the swing low. Above 0.382 = bulls still have it.</p></div>'+(mine.map(t=>'<div class="card"><div class="row"><div>'+t.who+'<div class="muted">'+t.role+" · "+t.dt+'</div></div><span class="side '+(t.side==="BUY"?"buy":"sell")+'">'+t.side+'</span></div><div class="muted">'+(t.qty?t.qty.toLocaleString()+" @ $"+(t.px||0).toFixed(2):t.note)+'</div></div>').join("")||'<div class="block">No named prints.</div>');$("fibOn").onclick=()=>{state.fib=true;render();};$("fibOff").onclick=()=>{state.fib=false;render();};}}
function init(){fit();addEventListener("resize",fit);if(window.visualViewport)visualViewport.addEventListener("resize",fit);const now=new Date();$("clock").textContent=((now.getHours()+11)%12+1)+":"+String(now.getMinutes()).padStart(2,"0");document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render();});$("go").onclick=()=>{state.q=$("q").value;const u=state.q.trim().toUpperCase();if(BOOK.some(b=>b.s===u))state.pick=u;render();};$("q").oninput=()=>{state.q=$("q").value;render();};render();}init();
</script></body></html>
