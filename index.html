<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PULSE"/>
<meta name="theme-color" content="#070708"/>
<title>PULSE</title>
<link rel="stylesheet" href="styles.css?v=4"/>
<style>
.regime{margin:0 16px 8px;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800;letter-spacing:.16em;text-align:center}
.regime.bull{background:rgba(61,255,176,.12);color:var(--buy);border:1px solid rgba(61,255,176,.28)}
.regime.bear{background:rgba(255,90,106,.12);color:var(--avoid);border:1px solid rgba(255,90,106,.28)}
.regime.vol{background:rgba(176,120,255,.16);color:#d4b6ff;border:1px solid rgba(176,120,255,.35)}
.mx{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dotx{font-size:9px;letter-spacing:.04em;padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.05);color:#7a808a}
.dotx.y{color:var(--buy);background:rgba(61,255,176,.12)}.dotx.n{color:#6a7078}
.clock{font-variant-numeric:tabular-nums;color:var(--watch);font-weight:700}
.tag.ck{background:rgba(255,213,106,.12);color:var(--watch)}
</style>
</head>
<body>
<div class="device"><div class="app">
<div class="flash"></div>
<div class="status"><span id="clock">9:41</span><span class="live"><i class="dot"></i> PULSE</span><span>iOS</span></div>
<div class="header"><div><div class="brand">PULSE</div><div class="sub">HEAT · FLOW · CONFLUENCE</div></div><div class="fng">CRYPTO F&amp;G<br><b>71 GREED</b></div></div>
<div id="regime" class="regime bull">REGIME · BULL · BUYS ALLOWED</div>
<div class="chips">
<button class="chip on" data-f="ALL">ALL</button>
<button class="chip" data-f="STOCK">STOCKS</button>
<button class="chip" data-f="ETF">ETFS</button>
<button class="chip" data-f="CRYPTO">CRYPTO</button>
</div>
<div class="screen">
<div class="legend">
<span class="sw"><i style="background:#3dffb0"></i>Buy flow</span>
<span class="sw"><i style="background:#ffd56a"></i>Watch</span>
<span class="sw"><i style="background:#ff5a6a"></i>Sell-off</span>
<span class="sw"><i style="background:#ff4d2e"></i>Heat</span>
</div>
<div id="list"></div>
</div>
<nav class="tabbar">
<button class="tab on" data-tab="heat">HEAT</button>
<button class="tab" data-tab="flow">FLOW</button>
<button class="tab" data-tab="scan">SCAN</button>
<button class="tab" data-tab="fib">FIB</button>
</nav>
<div class="home-ind"></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
</div></div>
<script src="data.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
