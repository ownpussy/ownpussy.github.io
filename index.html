<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0b0e11"/>
<title>Desk</title>
<style>
:root{--bg:#0b0e11;--panel:#161a1e;--line:#2b3139;--ink:#eaecef;--dim:#848e9c;--buy:#0ecb81;--sell:#f6465d;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.bar{padding:calc(10px + var(--safe-top)) 12px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.live{color:var(--buy);font-size:12px}button.ghost{border:0;background:transparent;color:var(--dim);font-size:14px}
.nav,.sub{display:flex;overflow:auto;border-bottom:1px solid var(--line)}
.nav button,.sub button{border:0;background:transparent;color:var(--dim);padding:10px 12px;font-size:13px;white-space:nowrap}
.nav button.on,.sub button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--buy)}
.search{padding:8px 12px}.search input{width:100%;border:0;background:var(--panel);color:var(--ink);border-radius:6px;padding:10px 12px;font-size:16px}
.mkt{width:100%;display:grid;grid-template-columns:1.4fr .8fr .7fr;gap:6px;align-items:center;padding:12px;border:0;border-bottom:1px solid #1e2329;background:transparent;color:inherit;text-align:left}
.mkt small{display:block;color:var(--dim);font-size:11px}.r{text-align:right;font-variant-numeric:tabular-nums}
.buy{color:var(--buy)}.sell{color:var(--sell)}.pill{display:inline-block;min-width:68px;text-align:center;border-radius:4px;padding:4px 6px;font-weight:650;font-size:12px}
.up{background:var(--buy);color:#07110c}.dn{background:var(--sell);color:#fff}
.note{padding:8px 12px;color:var(--dim);font-size:12px;line-height:1.4}
.quote{padding:12px 12px calc(20px + var(--safe-bot))}
.h{font-size:32px;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grid div{background:var(--panel);border-radius:6px;padding:8px}.grid b{display:block}.grid span{color:var(--dim);font-size:11px}
.fill{display:grid;grid-template-columns:1.3fr .7fr .8fr .6fr;gap:6px;padding:9px 0;border-bottom:1px solid #1e2329;font-size:13px}
.stage{position:relative;background:#12161c;border-radius:8px;overflow:hidden;touch-action:none}
.stage.big{position:fixed;inset:0;z-index:20;border-radius:0;padding-top:var(--safe-top);background:#0b0e11}
.tfs{display:flex;gap:4px;overflow:auto;padding:8px}
.tfs button{border:0;border-radius:4px;background:#1e2329;color:#848e9c;padding:7px 9px;font-size:12px;font-weight:700}
.tfs button.on{color:#0b0e11;background:#0ecb81}
svg{width:100%;display:block;background:#12161c}
.tools{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;color:#848e9c;font-size:12px}
</style></head>
<body><div id="app"><div class="note">Loading desk...</div></div>
<script>
var PAIRS=["BTC-USD","ETH-USD","SOL-USD","XRP-USD","DOGE-USD","LINK-USD","LTC-USD","AVAX-USD"];
var NAMES={BTC:"Bitcoin",ETH:"Ether",SOL:"Solana",XRP:"XRP",DOGE:"Dogecoin",LINK:"Chainlink",LTC:"Litecoin",AVAX:"Avalanche"};
var TFS=[{id:"1H",sec:3600,gran:60},{id:"4H",sec:14400,gran:300},{id:"8H",sec:28800,gran:300},{id:"12H",sec:43200,gran:900},{id:"24H",sec:86400,gran:900},{id:"36H",sec:129600,gran:3600},{id:"1W",sec:604800,gran:3600},{id:"2W",sec:1209600,gran:21600},{id:"1M",sec:2592000,gran:86400}];
var BOOKS={STOCKS:[{s:"NVDA",n:"NVIDIA",p:227.21,open:228.86,hi:234.76,lo:190},{s:"AAPL",n:"Apple",p:329.4,open:338.4,hi:345.34,lo:300},{s:"MSFT",n:"Microsoft",p:508.96,open:509.2,hi:519.4,lo:373},{s:"META",n:"Meta",p:738.79,open:715.6,hi:779.82,lo:524},{s:"AVGO",n:"Broadcom",p:355.1,open:349.6,hi:432.73,lo:336},{s:"AMZN",n:"Amazon",p:246.67,open:246.1,hi:287.2,lo:226},{s:"GOOGL",n:"Alphabet",p:340.92,open:342.7,hi:384.48,lo:315},{s:"TSLA",n:"Tesla",p:352.84,open:357.4,hi:419.56,lo:297}],ETFS:[{s:"SPY",n:"S&P 500",p:572.4,open:570.1,hi:575,lo:540},{s:"QQQ",n:"Nasdaq 100",p:498.2,open:496.4,hi:505,lo:450},{s:"IWM",n:"Russell 2000",p:218.6,open:219.4,hi:228,lo:190},{s:"SMH",n:"Semis",p:268.1,open:266.4,hi:280,lo:210},{s:"IBIT",n:"Bitcoin ETF",p:47.33,open:47.1,hi:49.22,lo:34.8},{s:"GLD",n:"Gold",p:242.8,open:241.9,hi:248,lo:210}],IRA:[{s:"SPY",n:"Core equity 50%",p:572.4,open:570.1,hi:575,lo:540},{s:"BND",n:"Bonds 30%",p:74.2,open:74.3,hi:76,lo:70},{s:"IBIT",n:"Bitcoin sleeve 10%",p:47.33,open:47.1,hi:49.22,lo:34.8},{s:"VNQ",n:"REIT sleeve 10%",p:92.4,open:92.8,hi:98,lo:78}],RE:[{s:"VNQ",n:"REIT index",p:92.4,open:92.8,hi:98,lo:78},{s:"O",n:"Realty Income",p:58.2,open:58.4,hi:64,lo:50},{s:"PLD",n:"Prologis",p:118.6,open:117.9,hi:126,lo:98},{s:"AMT",n:"American Tower",p:214.3,open:215.1,hi:230,lo:170}]};
var WHO=[{s:"META",who:"Javier Olivan",role:"COO",side:"SELL",qty:1575,px:749.82,dt:"09-28"},{s:"META",who:"Mark Zuckerberg",role:"CEO",side:"SELL",qty:27474,px:777.44,dt:"09-24"},{s:"AVGO",who:"Henry Samueli",role:"Director",side:"SELL",qty:702190,px:356.04,dt:"09-23"},{s:"AAPL",who:"Jennifer Newstead",role:"GC",side:"SELL",qty:2399,px:340.06,dt:"09-22"},{s:"META",who:"Christopher Cox",role:"CPO",side:"SELL",qty:40000,px:712.76,dt:"09-21"},{s:"NVDA",who:"Timothy Teter",role:"GC",side:"SELL",qty:30460,px:222.8,dt:"09-21"},{s:"NVDA",who:"Mark Stevens",role:"Director",side:"SELL",qty:1366000,px:219.73,dt:"09-18"},{s:"NVDA",who:"Colette Kress",role:"CFO",side:"SELL",qty:34918,px:219.05,dt:"09-17"},{s:"MSFT",who:"Amy Hood",role:"CFO",side:"SELL",qty:41674,px:498.27,dt:"09-14"},{s:"GME",who:"4 insiders",role:"Cluster",side:"BUY",qty:2683435,px:21.97,dt:"09-08"}];
var book={},series={},asset="CRYPTO",view="MARKETS",q="",openSym=null,tf="24H",src="Desk print",big=false,pan=0,pick=-1;
function money(n){var sign=n<0?"-":"+";n=Math.abs(n);if(n>=1e6)return sign+"$"+(n/1e6).toFixed(1)+"M";if(n>=1e3)return sign+"$"+(n/1e3).toFixed(1)+"k";return sign+"$"+n.toFixed(2);}
function qty(n){if(!n)return "range";if(n>=1e6)return (n/1e6).toFixed(2)+"M";if(n>=1e3)return (n/1e3).toFixed(1)+"k";return String(Math.round(n));}
function heat(ch){if(ch>=2)return "HOT";if(ch>=0)return "WARM";if(ch>-2)return "COLD";return "ICE";}
function withMath(x){var open=x.open||x.p,ch=open?(x.p/open-1)*100:0;return {s:x.s,n:x.n,p:x.p,open:open,hi:x.hi,lo:x.lo,vol:x.vol||0,ch:ch,gain:x.p-open};}
function spec(){for(var i=0;i<TFS.length;i++) if(TFS[i].id===tf) return TFS[i]; return TFS[4];}
function stamp(sec){var d=new Date(sec*1000),mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];var h=d.getHours(),ap=h>=12?"PM":"AM";h=h%12||12;return mo+" "+d.getDate()+" "+h+":"+String(d.getMinutes()).padStart(2,"0")+ap;}
function rows(){var base=asset==="CRYPTO"?Object.keys(book).map(function(k){return book[k];}):BOOKS[asset];if(asset==="CRYPTO"&&!base.length)base=[{s:"BTC",n:"Bitcoin",p:83493,open:83404,hi:85613,lo:82911,vol:7075}];var out=base.map(withMath);var query=q.trim().toUpperCase();if(query)out=out.filter(function(x){return x.s.indexOf(query)>=0||(x.n||"").toUpperCase().indexOf(query)>=0;});if(view==="MOVERS")out.sort(function(a,b){return b.ch-a.ch;});if(view==="LOSERS")out.sort(function(a,b){return a.ch-b.ch;});return out;}
function find(sym){if(book[sym])return withMath(book[sym]);var all=[];Object.keys(BOOKS).forEach(function(k){all=all.concat(BOOKS[k]);});for(var i=0;i<all.length;i++)if(all[i].s===sym)return withMath(all[i]);return null;}
function deskCandles(x){var s=spec(),n=Math.max(24,Math.min(80,Math.round(s.sec/s.gran))),frac=Math.sqrt(s.sec/2592000),span=Math.max((x.hi-x.lo)*frac,x.p*0.004),end=Math.floor(Date.now()/1000),out=[],i;for(i=0;i<n;i++){var t=i/(n-1),base=x.p-span*0.3+span*0.6*t+Math.sin(t*Math.PI*3)*span*0.08,o=base,c=base+Math.sin(i)*span*0.03,hi=Math.max(o,c)+span*0.02,lo=Math.min(o,c)-span*0.02;out.push({t:end-s.sec+i*s.gran,o:o,h:hi,l:lo,c:c});}return {bars:out,live:false};}
function pack(sym){return series[sym+"|"+tf]||deskCandles(find(sym));}
function chart(data){var bars=data.bars,start=Math.max(0,Math.min(bars.length-12,bars.length-28+pan)),viewBars=bars.slice(start,start+28);if(viewBars.length<4)viewBars=bars.slice(-28);var hi=Math.max.apply(null,viewBars.map(function(b){return b.h;})),lo=Math.min.apply(null,viewBars.map(function(b){return b.l;})),span=(hi-lo)||1,W=360,H=big?560:240,pad=42;function y(v){return pad+((hi-v)/span)*(H-pad*2);}var hiBar=viewBars[0],loBar=viewBars[0],i;for(i=0;i<viewBars.length;i++){if(viewBars[i].h>=hiBar.h)hiBar=viewBars[i];if(viewBars[i].l<=loBar.l)loBar=viewBars[i];}var body="",slot=W/viewBars.length;for(i=0;i<viewBars.length;i++){var b=viewBars[i],x=i*slot+slot/2,up=b.c>=b.o,color=up?"#0ecb81":"#f6465d",top=y(Math.max(b.o,b.c)),bot=y(Math.min(b.o,b.c));body+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+y(b.h).toFixed(1)+'" y2="'+y(b.l).toFixed(1)+'" stroke="'+color+'" stroke-width="1.2"/>';body+='<rect x="'+(x-Math.max(2,slot*0.28)).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+Math.max(8,slot*0.7).toFixed(1)+'" height="'+Math.max(1,bot-top).toFixed(1)+'" fill="'+color+'"/>';}body+='<line x1="0" x2="'+W+'" y1="'+y(hi).toFixed(1)+'" y2="'+y(hi).toFixed(1)+'" stroke="#f6465d" stroke-dasharray="4 3"/>';body+='<text x="8" y="'+(y(hi)+13).toFixed(1)+'" fill="#f6465d" font-size="11">HIGH '+hi.toFixed(2)+'  '+stamp(hiBar.t)+'</text>';body+='<line x1="0" x2="'+W+'" y1="'+y(lo).toFixed(1)+'" y2="'+y(lo).toFixed(1)+'" stroke="#0ecb81" stroke-dasharray="4 3"/>';body+='<text x="8" y="'+(y(lo)-6).toFixed(1)+'" fill="#0ecb81" font-size="11">LOW '+lo.toFixed(2)+'  '+stamp(loBar.t)+'</text>';var sel=viewBars[Math.max(0,Math.min(viewBars.length-1,pick<0?viewBars.length-1:pick))];var sx=(Math.max(0,Math.min(viewBars.length-1,pick<0?viewBars.length-1:pick))+0.5)*slot;body+='<line x1="'+sx.toFixed(1)+'" x2="'+sx.toFixed(1)+'" y1="28" y2="'+(H-24)+'" stroke="#eaecef" stroke-dasharray="2 3"/>';body+='<text x="8" y="'+(H-10)+'" fill="#848e9c" font-size="10">'+stamp(viewBars[0].t)+' to '+stamp(viewBars[viewBars.length-1].t)+'</text>';return {svg:'<svg viewBox="0 0 '+W+' '+H+'">'+body+'</svg>',hi:hi,lo:lo,hiT:hiBar.t,loT:loBar.t,sel:sel,n:viewBars.length};}
function quote(sym){var x=find(sym);if(!x)return '<div class="note">No quote.</div>';var data=pack(sym),g=chart(data),fills=WHO.filter(function(f){return f.s===sym;});var html='<div class="quote"><button class="ghost" id="back">Back</button><div class="note">'+x.n+' · '+(data.live?'live candles':'desk candles')+' · candlestick chart, drag a finger on a candle</div><div class="h '+(x.ch>=0?'buy':'sell')+'">'+Number(x.p).toLocaleString()+'</div><div class="'+(x.ch>=0?'buy':'sell')+'">'+money(x.gain)+'  '+(x.ch>=0?'+':'')+x.ch.toFixed(2)+'%</div><div class="grid"><div><b class="sell">'+g.sel.h.toFixed(2)+'</b><span>Finger high · '+stamp(g.sel.t)+'</span></div><div><b class="buy">'+g.sel.l.toFixed(2)+'</b><span>Finger low · '+stamp(g.sel.t)+'</span></div></div><div class="note">Hold and drag across a candle. That bar high is '+g.sel.h.toFixed(2)+', low is '+g.sel.l.toFixed(2)+'. Window high '+g.hi.toFixed(2)+' at '+stamp(g.hiT)+'.</div><div class="stage'+(big?' big':'')+'" id="stage"><div class="tfs">'+TFS.map(function(t){return '<button data-tf="'+t.id+'" class="'+(tf===t.id?'on':'')+'">'+t.id+'</button>';}).join('')+'</div>'+g.svg+'<div class="tools"><span>Candles '+tf+'</span><button class="ghost" id="exp">'+(big?'Shrink':'Expand')+'</button></div></div><div class="fill" style="color:#848e9c"><span>Who</span><span>Qty</span><span>Price</span><span>Side</span></div>';fills.forEach(function(f){html+='<div class="fill"><span>'+f.who+'<small style="display:block;color:#848e9c">'+f.role+' · '+f.dt+'</small></span><span>'+qty(f.qty)+'</span><span>'+(f.px?f.px.toFixed(2):'range')+'</span><span class="'+(f.side==='BUY'?'buy':'sell')+'">'+f.side+'</span></div>';});return html+'</div>';}
function bindPan(){var stage=document.getElementById("stage");if(!stage)return;function at(clientX){var r=stage.getBoundingClientRect(),n=28,i=Math.floor((clientX-r.left)/r.width*n);pick=Math.max(0,Math.min(n-1,i));draw();}stage.ontouchstart=function(e){at(e.touches[0].clientX);};stage.ontouchmove=function(e){at(e.touches[0].clientX);e.preventDefault();};stage.onmousedown=function(e){at(e.clientX);stage.onmousemove=function(ev){at(ev.clientX);};};stage.onmouseup=stage.onmouseleave=function(){stage.onmousemove=null;};}
function draw(){var assets=["STOCKS","ETFS","IRA","CRYPTO","RE"].map(function(k){return '<button data-k="'+k+'" class="'+(asset===k?'on':'')+'">'+k+'</button>';}).join('');var views=["MARKETS","MOVERS","LOSERS","WHO"].map(function(k){return '<button data-k="'+k+'" class="'+(view===k?'on':'')+'">'+k+'</button>';}).join('');var body="";if(openSym){body=quote(openSym);}else if(view==="WHO"){body='<div class="note">Newest first.</div>';WHO.forEach(function(w){body+='<button class="mkt" data-s="'+w.s+'"><span>'+w.who+'<small>'+w.s+' · '+w.role+' · '+w.dt+'</small></span><span class="r">'+qty(w.qty)+'<small>@ '+(w.px||'range')+'</small></span><span class="r"><span class="pill '+(w.side==='BUY'?'up':'dn')+'">'+w.side+'</span></span></button>';});}else{body='<div class="note">Tap a name. Drag the candles. Expand fills the screen. High and low show date and time.</div>';rows().forEach(function(x){body+='<button class="mkt" data-s="'+x.s+'"><span>'+x.s+'<small>'+x.n+' · '+heat(x.ch)+'</small></span><span class="r">'+Number(x.p).toLocaleString()+'<small>'+money(x.gain)+'</small></span><span class="r"><span class="pill '+(x.ch>=0?'up':'dn')+'">'+(x.ch>=0?'+':'')+x.ch.toFixed(2)+'%</span></span></button>';});}document.getElementById("app").innerHTML='<div class="bar"><b>Desk</b><span class="live">'+src+'</span><button class="ghost" id="refresh">Refresh</button></div><div class="nav" id="assets">'+assets+'</div><div class="sub" id="views">'+views+'</div><div class="search"><input id="q" placeholder="Search symbol" value="'+q.replace(/"/g,"")+'"/></div>'+body;document.querySelectorAll("#assets button").forEach(function(b){b.onclick=function(){asset=b.dataset.k;openSym=null;draw();};});document.querySelectorAll("#views button").forEach(function(b){b.onclick=function(){view=b.dataset.k;openSym=null;draw();};});var box=document.getElementById("q");if(box)box.oninput=function(){q=box.value;draw();};var rf=document.getElementById("refresh");if(rf)rf.onclick=refresh;document.querySelectorAll("[data-s]").forEach(function(el){el.onclick=function(){openSym=el.dataset.s;pan=0;draw();loadCandles(openSym);};});var back=document.getElementById("back");if(back)back.onclick=function(){openSym=null;big=false;draw();};var exp=document.getElementById("exp");if(exp)exp.onclick=function(){big=!big;draw();};document.querySelectorAll("[data-tf]").forEach(function(b){b.onclick=function(){tf=b.dataset.tf;pan=0;draw();loadCandles(openSym);};});bindPan();}
function loadCandles(sym){if(!sym||!NAMES[sym])return;var s=spec(),picked=tf,end=Math.floor(Date.now()/1000),start=end-s.sec;fetch("https://api.exchange.coinbase.com/products/"+sym+"-USD/candles?granularity="+s.gran+"&start="+new Date(start*1000).toISOString()+"&end="+new Date(end*1000).toISOString()).then(function(r){return r.json();}).then(function(rows){if(!rows||!rows.length||!rows[0].length)return;rows.sort(function(a,b){return a[0]-b[0];});series[sym+"|"+picked]={live:true,bars:rows.map(function(c){return {t:+c[0],l:+c[1],h:+c[2],o:+c[3],c:+c[4]};})};if(openSym===sym&&tf===picked)draw();}).catch(function(){});}
function refresh(){src="Sync";draw();Promise.all(PAIRS.map(function(pair){return Promise.all([fetch("https://api.exchange.coinbase.com/products/"+pair+"/ticker").then(function(r){return r.json();}),fetch("https://api.exchange.coinbase.com/products/"+pair+"/stats").then(function(r){return r.json();})]).then(function(both){var t=both[0],s=both[1],sym=pair.split("-")[0],last=+t.price,open=+s.open||last;book[sym]={s:sym,n:NAMES[sym],p:last,open:open,hi:+s.high,lo:+s.low,vol:+s.volume};});})).then(function(){src="Live";draw();if(openSym)loadCandles(openSym);}).catch(function(){src="Desk print";draw();});}
draw();refresh();setInterval(refresh,20000);
</script></body></html>
